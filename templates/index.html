<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Bot | GDG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
    </button>

    <!-- Settings Button -->
    <button id="settings-btn" class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Settings</h2>
                <button class="modal-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="api-key-input">Google API Key</label>
                    <p class="setting-hint">Enter your Google AI Studio API key to enable the bot.</p>
                    <input type="password" id="api-key-input" placeholder="AIzaSy...">
                    <button class="save-btn" onclick="saveApiKey()">Save API Key</button>
                    <p id="api-status" class="status-msg"></p>
                </div>
                <div class="setting-group">
                    <label>API Key Status</label>
                    <div id="key-status-badge" class="badge badge-inactive">Not configured</div>
                </div>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="gdg-logo">
                    <span class="gdg-letter g-blue">G</span><span class="gdg-letter g-red">D</span><span class="gdg-letter g-yellow">G</span>
                </div>
                <div class="header-info">
                    <h1>Research Bot</h1>
                    <p class="tagline">Intelligent Research Assistant</p>
                </div>
            </div>
            <div class="header-right">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="chat-area">
            <div id="chat-container" class="chat-container">
                <div class="message bot-message">
                    <div class="avatar bot-avatar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </div>
                    <div class="bubble bot-bubble">
                        <p>Hello! I'm your research assistant. Ask me anything and I'll find reliable information for you.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-section">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Ask your question..." rows="2"></textarea>
                <button id="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div class="export-bar">
                <button onclick="exportAs('markdown')" class="btn-export btn-md">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 20V4h5v7h7v9H6z"/></svg>
                    Export Markdown
                </button>
                <button onclick="exportAs('pdf')" class="btn-export btn-pdf">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v1zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
                    Export PDF
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Built by <strong>Ali Moojid</strong> &bull; Powered by Google Gemini</p>
        </footer>
    </div>

    <script>
        var chatContainer = document.getElementById('chat-container');
        var userInput = document.getElementById('user-input');
        var conversationHistory = [];
        var apiKey = localStorage.getItem('google_api_key') || '';

        // Theme management
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();

        // Settings functions
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('api-key-input').value = apiKey;
            updateKeyStatus();
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveApiKey() {
            var newKey = document.getElementById('api-key-input').value.trim();
            var statusEl = document.getElementById('api-status');
            if (!newKey) {
                statusEl.textContent = 'Please enter a valid API key.';
                statusEl.className = 'status-msg error';
                return;
            }
            apiKey = newKey;
            localStorage.setItem('google_api_key', apiKey);
            statusEl.textContent = '✅ API Key saved successfully!';
            statusEl.className = 'status-msg success';
            updateKeyStatus();
            setTimeout(function() { statusEl.textContent = ''; }, 3000);
        }

        function updateKeyStatus() {
            var badge = document.getElementById('key-status-badge');
            if (apiKey && apiKey.length > 10) {
                badge.textContent = 'Configured ✓';
                badge.className = 'badge badge-active';
            } else {
                badge.textContent = 'Not configured';
                badge.className = 'badge badge-inactive';
            }
        }

        // Send message
        async function sendMessage() {
            var message = userInput.value.trim();
            if (!message) return;
            if (!apiKey) {
                addMessage('Please set your API key first. Click the ⚙️ settings button.', 'error');
                return;
            }
            addMessage(message, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            var loadingId = addLoading();
            try {
                var response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, api_key: apiKey })
                });
                removeLoading(loadingId);
                if (response.ok) {
                    var data = await response.json();
                    addMessage(data.reply, 'bot');
                    conversationHistory.push({ role: 'bot', content: data.reply });
                } else {
                    var error = await response.json();
                    addMessage('Error: ' + error.error, 'error');
                }
            } catch (err) {
                removeLoading(loadingId);
                addMessage('Connection error: ' + err.message, 'error');
            }
        }

        function addMessage(text, type) {
            var div = document.createElement('div');
            div.className = 'message ' + type + '-message';
            var avatarHTML = '';
            if (type === 'user') {
                avatarHTML = '<div class="avatar user-avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>';
            } else if (type === 'bot') {
                avatarHTML = '<div class="avatar bot-avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>';
            } else {
                avatarHTML = '<div class="avatar error-avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>';
            }
            div.innerHTML = avatarHTML + '<div class="bubble ' + type + '-bubble">' + formatText(text) + '</div>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoading() {
            var id = 'loading-' + Date.now();
            var div = document.createElement('div');
            div.id = id;
            div.className = 'message bot-message';
            div.innerHTML = '<div class="avatar bot-avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>' +
                            '<div class="bubble bot-bubble loading"><div class="dots"><span></span><span></span><span></span></div></div>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            var el = document.getElementById(id);
            if (el) el.remove();
        }

        function formatText(text) {
            return text.replace(/\n/g, '<br>');
        }

        async function exportAs(format) {
            if (conversationHistory.length === 0) {
                alert('No content to export yet!');
                return;
            }
            var content = conversationHistory.map(function(msg) {
                return msg.role === 'bot' ? '## Answer:\n\n' + msg.content : '## Question:\n\n' + msg.content;
            }).join('\n\n---\n\n');
            try {
                var response = await fetch('/export/' + format, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                if (response.ok) {
                    var blob = await response.blob();
                    var url = window.URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'research_' + new Date().toISOString().slice(0, 10) + '.' + (format === 'pdf' ? 'pdf' : 'md');
                    a.click();
                    window.URL.revokeObjectURL(url);
                }
            } catch (err) {
                alert('Export failed: ' + err.message);
            }
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        document.getElementById('settings-modal').addEventListener('click', function(e) {
            if (e.target === this) closeSettings();
        });
    </script>
</body>
</html>
